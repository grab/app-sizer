// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.grab:size-analysis:SNAPSHOT"
    }
}

plugins {
    id 'com.android.application' version '7.3.1' apply false
    id 'com.android.library' version '7.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.20' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.8.20' apply false
}

apply plugin: "com.grab.size-analysis"

appSizeAnalysis {
    outputDirectory = new File(project.buildDir, "size-report")
    featureMappingFile = new File(project.rootDir, 'module-owner.yml')
    bundleToolPath = new File(project.rootDir, '/binary/bundletool-all-1.15.4.jar').toString()
    bundleFilePath = "${project.rootDir}/app/build/outputs/bundle/gpsRelease/app-gps-release.aab"
    tag = "tag-anything"
}