// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.grab:size-analysis:SNAPSHOT"
    }
}

plugins {
    id 'com.android.application' version '7.3.1' apply false
    id 'com.android.library' version '7.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.20' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.8.20' apply false
}


task buildClt(type: Exec) {
    workingDir '../clt'
    commandLine 'gradle', 'shadowJar'
}

task grantExecutePermission(dependsOn: 'buildClt', type: Exec) {
    commandLine 'chmod', '+x', '../clt/build/libs/clt-1.1-SNAPSHOT-all.jar'
}

task runCommandline(dependsOn: 'grantExecutePermission', type: Exec) {
    commandLine 'java', '-jar', '../clt/build/libs/clt-1.1-SNAPSHOT-all.jar'

}


