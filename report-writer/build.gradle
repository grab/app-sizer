plugins {
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation project(":agent-report")
    implementation('org.apache.poi:poi-ooxml:5.2.2')
    implementation('org.jxls:jxls-jexcel:1.0.9')
}

compileKotlin {
    kotlinOptions.jvmTarget = '1.8'
}

compileTestKotlin {
    kotlinOptions.jvmTarget = '1.8'
}