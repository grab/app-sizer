plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.5.10'
    id "org.jetbrains.kotlin.kapt" version "1.5.10"
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}
group = "com.grab.tool"
version = "1.0-SNAPSHOT"

test {
    useJUnitPlatform()
}

shadowJar {
    zip64 true

    manifest {
        attributes 'Main-Class': 'com.grab.tools.MainKt'
    }

    mergeServiceFiles()
}

dependencies {
    implementation project(":report-writer")
    implementation project(":agent-report")
    implementation("org.smali:dexlib2:2.5.2")
    implementation("com.github.ajalt.clikt:clikt:3.2.0")
    implementation("com.android.tools.build:bundletool:1.8.0")
    implementation("com.android.tools.apkparser:apkanalyzer:30.0.2")
    implementation("com.android.tools:common:27.0.2")
    implementation("org.yaml:snakeyaml:1.21")

    implementation("net.sf.kxml:kxml2:2.3.0")
    implementation("com.google.guava:guava:30.1.1-jre")
    implementation("org.apache.poi:poi-ooxml:5.0.0")
    implementation("org.jxls:jxls-jexcel:1.0.6")

    implementation("com.google.dagger:dagger:2.38.1")
    kapt("com.google.dagger:dagger-compiler:2.38.1")
    implementation('com.google.code.gson:gson:2.8.8')


    testImplementation("org.jetbrains.kotlin:kotlin-test:1.5.21")
}
