plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.5.10'
    id "org.jetbrains.kotlin.kapt" version "1.5.10"
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}
group = "com.grab.tool"
version = "1.1-SNAPSHOT"

test {
    useJUnitPlatform()
}

shadowJar {
    zip64 true

    manifest {
        attributes 'Main-Class': 'com.grab.tools.MainKt'
    }

    mergeServiceFiles()
}

dependencies {
    implementation project(":report-writer")
    implementation project(":agent-report")
    implementation libs.dexlib2
    implementation libs.clikt
    implementation libs.bundletool
    implementation libs.apkanalyzer
    implementation libs.common
    implementation libs.jackson.module.kotlin
    implementation libs.jackson.dataformat.yaml
    implementation libs.kxml2
    implementation libs.guava
    implementation libs.poi.ooxml
    implementation libs.jxls.jexcel
    implementation libs.google.dagger
    kapt libs.dagger.compiler
    implementation libs.gson
    testImplementation libs.kotlin.test
}

compileKotlin {
    kotlinOptions.jvmTarget = '1.8'
}

compileTestKotlin {
    kotlinOptions.jvmTarget = '1.8'
}
