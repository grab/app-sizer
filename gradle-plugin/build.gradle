plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-gradle-plugin'
    id "org.jetbrains.kotlin.kapt"
    alias(libs.plugins.kotlin.dsl)
}

group = 'com.grab'
version = "SNAPSHOT"

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation project(':app-sizer')
    implementation libs.android.gradle.plugin
    implementation libs.gradle.api
    implementation libs.google.dagger
    kapt libs.dagger.compiler
}

gradlePlugin {
    // Define the plugin
    plugins {
        sizeAnalysis {
            id = 'com.grab.app-sizer'
            implementationClass = 'com.grab.plugin.sizer.AppSizePlugin'
            displayName = "SizeAnalysis"
        }
    }
}


def libArtifactId = 'app-sizer'

apply from: '../publish.gradle'
configureArtifact(group, version, libArtifactId)

repositories {
    mavenCentral()
}
