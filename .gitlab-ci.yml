default:
  image: gitlab.myteksi.net:4567/mobile/platform/mobile-tooling/base-android:33.1.2

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - build
  - test
  - publish

build:
  stage: build
  script: ./gradlew gradle-plugin:assemble
  tags:
    - xlarge
  artifacts:
    paths:
      - gradle-plugin/build/libs/*.jar
      - clt/build/libs/*.jar
    expire_in: 1 week

test:
  stage: test
  tags:
    - xlarge
  script:
    - ./gradlew test

build_sample_app:
  stage: test
  tags:
    - xlarge
  script:
    - cd ./sample
    - ./gradlew app:appSizeAnalysisProRelease --stacktrace -Dorg.gradle.debug=false --no-daemon

publish_artifact:
  stage: build
  rules:
    - if: $RELEASE == "publish"
  tags:
    - xlarge
  script:
    - ./gradlew artifactoryPublish